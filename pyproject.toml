[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "generabuild-desktop"
version = "0.3.2"
description = "Photo-first desktop urban visualization with four-camera synchronization"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.8,<7", "numpy>=1.26,<3", "scipy>=1.11,<2", "opencv-python-headless>=4.8,<5", "Pillow>=10,<13", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
generabuild-studio = "generabuild_desktop.main:start"

[tool.setuptools]
py-modules = ["gb21_extension_mask", "gb21_photo_finish", "gb21_shared_facades", "gb21_roof_finish"]

[tool.setuptools.packages.find]
include = ["generabuild*", "generabuild_desktop*"]
